<div class="ion-page">
  <div class="notifications-page">

    <!-- HEADER -->
    <div class="page-header">

      <div>
        <h1>Notifikasi</h1>

        <p>
          {{ unread }} notifikasi belum dibaca
        </p>
      </div>


      <button *ngIf="unread > 0" type="button" class="btn-outline" (click)="markAllRead()">
        Tandai Semua Dibaca
      </button>

    </div>


    <!-- NOTIFICATION LIST -->
    <div class="notification-list">

      <div *ngFor="let notification of filteredNotifications" class="notification-card"
        [class.unread]="!notification.read" (click)="markAsRead(notification.id)">

        <!-- ICON -->
        <span class="notification-icon" [attr.data-type]="notification.type">@switch (notification.type) {@case ('success') {<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>}@case ('warning') {<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg>}@case ('danger') {<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>}@default {<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>}}</span>


        <!-- CONTENT -->
        <div class="notification-content">

          <div class="notification-header">

            <p class="notification-title" [class.unread-title]="!notification.read">
              {{ notification.title }}
            </p>

            <span class="notification-date">
              {{ formatDate(notification.date) }}
            </span>

          </div>


          <p class="notification-message">
            {{ notification.message }}
          </p>

        </div>


        <!-- UNREAD DOT -->
        <div *ngIf="!notification.read" class="unread-dot"></div>

      </div>

      <div *ngIf="filteredNotifications.length === 0" class="empty-card">

        <div class="empty-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>

        <p>
          Tidak ada notifikasi
        </p>

      </div>

    </div>

  </div>
</div>
